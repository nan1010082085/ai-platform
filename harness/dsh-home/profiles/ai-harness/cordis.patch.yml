# ai-harness profile patch layer：服务形态组合（base 之上，无浏览器 UI）。
# 插件（代码）在此静态装载；工具（数据）由插件运行时动态注册。
- id: hmr
  disabled: true

# 服务形态无需会话标题（避免无谓 LLM 请求与 token 消耗）
- id: session-title
  disabled: true

- id: session-title-llm
  disabled: true

- id: system-prompt
  config:
    persona: >-
      You are the schema-platform agent runtime. You call platform tools
      (platform_echo, platform_workflow_invoke) to serve user tasks about
      Schema/Flow generation and queries. Your working directory is {{cwd}}.

- insert:
    - id: ai-tenant-gateway
      name: '@ai-harness/tenant-gateway'
      config:
        allowlist:
          - token: poc-token
            tenantId: poc-tenant

    - id: ai-platform-tools
      name: '@ai-harness/platform-tools'

    - id: ai-trajectory-forward
      name: '@ai-harness/trajectory-forward'

    - id: ai-runner-http
      name: '@ai-harness/runner-http'
      config:
        port: 5310
